name: CI

on:
  push:
    branches: [ "main", "chore/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Build Engine
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Engine Tests
        run: cargo test --manifest-path engine/Cargo.toml --verbose

      - name: Build Engine Release Binary
        run: cargo build --release --manifest-path engine/Cargo.toml --verbose
