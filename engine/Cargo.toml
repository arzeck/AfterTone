[package]
name = "aftertone-native"
version = "0.1.0"
edition = "2021"
description = "AfterTone Listen Together Protocol, Synced Karaoke Lyrics, Audio Proxy & Party Server in Rust"
authors = ["AfterTone Contributors"]

[lib]
name = "aftertone_native"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "aftertone-native"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
regex = "1.10"
url = "2.5"
base64 = "0.22"
bytes = "1.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
tracing = "0.1"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tao = "0.32"
wry = "0.49"
lofty = "0.21"
walkdir = "2.5"
discord-rich-presence = "1.1"
souvlaki = "0.9"
jni = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
]

[dev-dependencies]
tokio-test = "0.4"
